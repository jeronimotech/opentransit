name: Docs issue
description: Something in the documentation or the site is wrong, missing or unclear
labels: [documentation]
body:
  - type: input
    id: page
    attributes: { label: Page URL, placeholder: "https://opentransit.tech/docs/..." }
    validations: { required: true }
  - type: textarea
    id: what
    attributes: { label: What is wrong or missing? }
    validations: { required: true }
  - type: textarea
    id: fix
    attributes: { label: Suggested fix (optional) }
